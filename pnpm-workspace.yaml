packages:
  - packages/*
overrides:
  nodemailer: '10.4.0'
# Fail installs when a package's dependencies fall outside a provider's
# peer range, such as an imapflow major that the providers don't accept.
strictPeerDependencies: true
allowBuilds:
  better-sqlite3: false
  esbuild: true
# Keep Renovate's minimumReleaseAge at least this long. To ship an urgent fix
# sooner, add the exact version to minimumReleaseAgeExclude.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@fluxmail/*'
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types@6.21.0
