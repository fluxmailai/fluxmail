packages:
  - packages/*
overrides:
  nodemailer: '10.2.1'
allowBuilds:
  better-sqlite3: false
  esbuild: true
# Keep Renovate's minimumReleaseAge at least this long. To ship an urgent fix
# sooner, add the exact version to minimumReleaseAgeExclude.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - '@fluxmail/*'
  # Renovate security update: zod@4.6.6
  - zod@4.6.6
minimumReleaseAgeExcludePrune: true
trustPolicy: no-downgrade
trustPolicyExclude:
  - undici-types@6.21.0
