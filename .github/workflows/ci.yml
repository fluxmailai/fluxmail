name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Check Claude Code plugin
        run: pnpm plugin:check

      - name: Lint
        run: pnpm lint

      - name: Check formatting
        run: pnpm format:check

      - name: Build
        run: pnpm build

      - name: Check shared MCP tool contract
        run: pnpm contract:check

      - name: Check public docs
        run: pnpm docs:check

      - name: Start GreenMail
        uses: ./.github/actions/greenmail

      - name: Test
        run: pnpm test
        env:
          GREENMAIL_HOST: 127.0.0.1
          NODE_TLS_REJECT_UNAUTHORIZED: 0

  docker:
    name: Build Docker image
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # The release builds this image only after the npm packages are published, so a broken Dockerfile is caught here.
      - name: Build image
        run: docker build --tag fluxmail-ci .

      - name: Run the CLI in the image
        run: docker run --rm fluxmail-ci --version
