name: Publish release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version without the v prefix
        required: true
        type: string
      release_sha:
        description: Full commit SHA on main that contains the approved changelog
        required: true
        type: string
      npm_tag:
        description: npm distribution tag
        required: true
        default: latest
        type: choice
        options:
          - latest
          - next

concurrency:
  group: publish-release
  cancel-in-progress: false

env:
  RELEASE_IMAGE: ghcr.io/fluxmailai/fluxmail

jobs:
  build:
    name: Build release packages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read

    steps:
      - name: Validate workflow inputs
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          [[ "$RELEASE_SHA" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]

      - name: Check out approved release tree
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install MCP publisher
        env:
          MCP_PUBLISHER_VERSION: v1.7.9
        run: |
          mkdir -p .context/bin .context/downloads
          curl --fail --location --silent --show-error \
            --output .context/downloads/mcp-publisher.tar.gz \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/mcp-publisher_linux_amd64.tar.gz"
          publisher_version="${MCP_PUBLISHER_VERSION#v}"
          curl --fail --location --silent --show-error \
            --output .context/downloads/checksums.txt \
            "https://github.com/modelcontextprotocol/registry/releases/download/${MCP_PUBLISHER_VERSION}/registry_${publisher_version}_checksums.txt"
          expected=$(grep 'mcp-publisher_linux_amd64.tar.gz$' .context/downloads/checksums.txt | awk '{print $1}')
          echo "${expected}  .context/downloads/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf .context/downloads/mcp-publisher.tar.gz -C .context/bin mcp-publisher
          echo "$PWD/.context/bin" >> "$GITHUB_PATH"

      - name: Validate release metadata
        env:
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: pnpm release validate --version "$RELEASE_VERSION" --sha "$RELEASE_SHA"

      - name: Build
        run: pnpm build

      - name: Save publishable package builds
        uses: actions/upload-artifact@v4
        with:
          name: release-build-${{ inputs.release_sha }}
          path: |
            packages/*/dist
            .context/bin/mcp-publisher
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 1

  # The server tests take the longest, so they run in their own job while the
  # other job runs the static checks and the remaining tests.
  validate:
    name: Validate release tree (${{ matrix.part }})
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - part: checks and package tests
            checks: true
            test: pnpm -r --filter '!fluxmail' test && pnpm exec vitest run scripts/*.test.ts
          - part: server tests
            checks: false
            test: pnpm --filter fluxmail test

    steps:
      - name: Check out approved release tree
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Test the same build output that npm and the Docker image receive.
      - name: Restore publishable package builds
        uses: actions/download-artifact@v4
        with:
          name: release-build-${{ inputs.release_sha }}
          path: .

      - name: Lint
        if: matrix.checks
        run: pnpm lint

      - name: Check formatting
        if: matrix.checks
        run: pnpm format:check

      - name: Typecheck
        if: matrix.checks
        run: pnpm typecheck

      - name: Check shared MCP tool contract
        if: matrix.checks
        run: pnpm contract:check

      - name: Check public docs
        if: matrix.checks
        run: pnpm docs:check

      - name: Start GreenMail
        uses: ./.github/actions/greenmail

      - name: Test
        run: ${{ matrix.test }}
        env:
          GREENMAIL_HOST: 127.0.0.1
          NODE_TLS_REJECT_UNAUTHORIZED: 0

  # Runs alongside validation. Each platform image is pushed by digest only, with no
  # tag, so users cannot pull it until the publish job tags it after validation passes.
  image:
    name: Build ${{ matrix.platform }} image
    needs: build
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm

    steps:
      - name: Check out approved release tree
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}

      - name: Restore publishable package builds
        uses: actions/download-artifact@v4
        with:
          name: release-build-${{ inputs.release_sha }}
          path: ${{ runner.temp }}/release-build

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          build-contexts: package-builds=${{ runner.temp }}/release-build
          platforms: ${{ matrix.platform }}
          pull: true
          provenance: mode=min
          outputs: type=image,name=${{ env.RELEASE_IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=release-image-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=release-image-${{ matrix.arch }}

      - name: Record image digest
        env:
          IMAGE_DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          [[ "$IMAGE_DIGEST" =~ ^sha256:[0-9a-f]{64}$ ]]
          mkdir -p "$RUNNER_TEMP/release-image-digest"
          echo "$IMAGE_DIGEST" > "$RUNNER_TEMP/release-image-digest/${{ matrix.arch }}"

      - name: Save image digest
        uses: actions/upload-artifact@v4
        with:
          name: release-image-${{ inputs.release_sha }}-${{ matrix.arch }}
          path: ${{ runner.temp }}/release-image-digest/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  publish:
    name: Publish approved release
    needs: [validate, image]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: release
    permissions:
      contents: write
      id-token: write
      packages: write

    steps:
      - name: Check out approved release tree
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v6.1.1

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install npm with trusted publishing support
        run: npm install --global npm@11

      - name: Restore publishable package builds
        uses: actions/download-artifact@v4
        with:
          name: release-build-${{ inputs.release_sha }}
          path: .

      - name: Restore MCP publisher
        run: |
          chmod +x .context/bin/mcp-publisher
          echo "$PWD/.context/bin" >> "$GITHUB_PATH"

      - name: Restore image digests
        uses: actions/download-artifact@v4
        with:
          pattern: release-image-${{ inputs.release_sha }}-*
          path: ${{ runner.temp }}/release-image-digests
          merge-multiple: true

      # `docker buildx imagetools` uses the runner's preinstalled Buildx, so this job
      # skips setup-buildx-action and its builder container.
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish or resume release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NPM_CONFIG_REGISTRY: https://registry.npmjs.org/
          RELEASE_NPM_TAG: ${{ inputs.npm_tag }}
          RELEASE_SHA: ${{ inputs.release_sha }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: |
          docker_digests=$(cat "$RUNNER_TEMP"/release-image-digests/* | paste -sd, -)
          pnpm release publish \
            --version "$RELEASE_VERSION" \
            --sha "$RELEASE_SHA" \
            --npm-tag "$RELEASE_NPM_TAG" \
            --docker-image "$RELEASE_IMAGE" \
            --docker-digests "$docker_digests" \
            --resume \
            --skip-checks \
            --ci

  claude-plugin:
    name: Refresh Claude Code plugin source
    needs: publish
    if: inputs.npm_tag == 'latest'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    concurrency:
      group: claude-code-plugin-source
      cancel-in-progress: false
    steps:
      - name: Check out published release
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.release_sha }}
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22.22.0
      - name: Refresh plugin source for current stable release
        run: node scripts/claude-code-plugin.mjs publish --skip-stale
