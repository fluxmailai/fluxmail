name: MCP bundle

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: mcpb-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bundle:
    name: Build and verify
    runs-on: ubuntu-latest
    timeout-minutes: 20
    outputs:
      cross-platform: ${{ steps.changes.outputs.cross-platform }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 2
      - name: Check for native dependency changes
        id: changes
        shell: bash
        run: |
          # Pull requests check out a merge commit whose first parent is the base branch.
          if [ "$GITHUB_EVENT_NAME" != pull_request ]; then
            cross_platform=true
          else
            changed=$(git diff --name-only HEAD^1 HEAD)
            if grep -qE '^(package\.json|pnpm-lock\.yaml|pnpm-workspace\.yaml|packages/[^/]+/package\.json|scripts/(build-mcpb|setup-mcpb-check|verify-mcpb)\.mjs|\.github/workflows/mcpb\.yml)$|^mcpb/|^\.github/actions/verify-mcpb-alpine/' <<< "$changed"; then
              cross_platform=true
            else
              cross_platform=false
            fi
          fi
          echo "cross-platform=$cross_platform" >> "$GITHUB_OUTPUT"
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # The build also verifies the extracted bundle on this runner.
      - run: pnpm mcpb:build
      - name: Extract bundle for Alpine Linux
        shell: bash
        run: |
          version=$(node -p "require('./packages/server/package.json').version")
          mkdir -p .context/mcpb/extracted
          unzip -qq ".context/mcpb/fluxmail-$version.mcpb" -d .context/mcpb/extracted
      - name: Verify on Alpine Linux
        uses: ./.github/actions/verify-mcpb-alpine
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: steps.changes.outputs.cross-platform == 'true'
        with:
          name: fluxmail-mcpb
          path: .context/mcpb/fluxmail-*.mcpb
          include-hidden-files: true
          if-no-files-found: error

  cross-platform:
    name: Verify on ${{ matrix.os }}
    needs: bundle
    if: needs.bundle.outputs.cross-platform == 'true'
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-24.04-arm
          - macos-15-intel
          - macos-15
          - windows-latest
          - windows-11-arm
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: fluxmail-mcpb
          path: .context/mcpb
      - name: Verify extracted bundle
        shell: bash
        run: |
          version=$(node -p "require('./packages/server/package.json').version")
          mkdir -p .context/mcpb/extracted
          unzip -qq ".context/mcpb/fluxmail-$version.mcpb" -d .context/mcpb/extracted
          node scripts/verify-mcpb.mjs .context/mcpb/extracted "$version"
      - name: Verify on Alpine Linux
        if: startsWith(matrix.os, 'ubuntu')
        uses: ./.github/actions/verify-mcpb-alpine
