name: Refresh Claude Code plugin

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: claude-code-plugin-source
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out main
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: main
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version: 22.22.0
      - name: Refresh plugin source
        run: node scripts/claude-code-plugin.mjs publish
